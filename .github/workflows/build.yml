name: Build fix-ligature-text

on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
  pull_request:
    branches: ['**']

env:
  XOVI_TAG: v0.3.3

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: aarch64
            image: eeems/remarkable-toolchain:5.8.203-aarch64
            sdk: /opt/codex/chiappa
            cxx_variable: CXX_AARCH64
          - arch: armv7
            image: eeems/remarkable-toolchain:5.8.203-armv7
            sdk: /opt/codex/rm1
            cxx_variable: CXX_ARMV7
    container:
      image: ${{ matrix.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download xovi source
        run: |
          curl -L -o xovi.tar.gz \
            "https://github.com/asivery/xovi/archive/refs/tags/$XOVI_TAG.tar.gz"
          tar -xzf xovi.tar.gz
          mv xovi-* xovi-repo
          rm xovi.tar.gz

      - name: Build ${{ matrix.arch }}
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          . "$(find ${{ matrix.sdk }} -name 'environment-setup-*' -type f | head -n1)"
          make fix-ligature-text-${{ matrix.arch }}.so \
            ${{ matrix.cxx_variable }}="$CXX" \
            XOVI_REPO="$GITHUB_WORKSPACE/xovi-repo" \
            VERSION="$VERSION"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fix-ligature-text-${{ matrix.arch }}
          path: fix-ligature-text-${{ matrix.arch }}.so
          retention-days: 90

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Generate changelog
        run: |
          git cliff --config-url https://gist.githubusercontent.com/rmitchellscott/823c46de7a1c3e6d57e9de90ee00d84a/raw/cliff.toml \
            --latest --strip header | tail -n +2 > RELEASE_NOTES.md
          git cliff --config-url https://gist.githubusercontent.com/rmitchellscott/823c46de7a1c3e6d57e9de90ee00d84a/raw/cliff.toml > CHANGELOG.md

      - name: Add device compatibility info
        run: |
          cat >> RELEASE_NOTES.md << 'EOF'

          ## Device Compatibility

          Software 3.28 and 3.29 (Qt 6.10.3):

          - **reMarkable Paper Pro**: `fix-ligature-text-aarch64.so`
          - **reMarkable Paper Pro Move**: `fix-ligature-text-aarch64.so`
          - **reMarkable Paper Pure**: `fix-ligature-text-aarch64.so`
          - **reMarkable 2**: `fix-ligature-text-armv7.so`
          - **reMarkable 1**: `fix-ligature-text-armv7.so`

          Rename the file to `fix-ligature-text.so` when installing it by hand.
          EOF

      - name: Commit changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --staged --quiet; then
            echo "No changelog changes to commit"
          else
            git commit -m "chore(release): update changelog for ${{ github.ref_name }} [skip ci]"
            git push origin HEAD:main
          fi

      - name: Download aarch64 artifact
        uses: actions/download-artifact@v4
        with:
          name: fix-ligature-text-aarch64

      - name: Download armv7 artifact
        uses: actions/download-artifact@v4
        with:
          name: fix-ligature-text-armv7

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            fix-ligature-text-aarch64.so
            fix-ligature-text-armv7.so
          body_path: RELEASE_NOTES.md
